buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// 添加必要的仓库
repositories {
    mavenCentral()
}

configurations {
    webpBundle
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Mixin 注解处理器
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // WebP 贴图解码（YSM 模型贴图常为 WebP 伪装 .png 扩展名），纯 Java 实现。
    // 不能直接合并 com.twelvemonkeys.* 进 mod jar：客户端其他 mod（Connector 系）也带同名模块，
    // JPMS 两个模块导出同一包会直接 ResolutionException 崩溃。
    // → relocateWebp 任务把包名同长度重定位为 ysm.twelvemonkeys.*（字节级替换，class 结构不变）
    webpBundle 'com.twelvemonkeys.imageio:imageio-webp:3.10.1'
    webpBundle 'com.twelvemonkeys.imageio:imageio-core:3.10.1'
    webpBundle 'com.twelvemonkeys.imageio:imageio-metadata:3.10.1'
    webpBundle 'com.twelvemonkeys.common:common-lang:3.10.1'
    webpBundle 'com.twelvemonkeys.common:common-io:3.10.1'
    webpBundle 'com.twelvemonkeys.common:common-image:3.10.1'

    // dev 运行时加载重定位后的解码器（生产由 jar 任务合并）
    runtimeOnly files('repack/webp-relocated.jar')
}

// 重定位 Twelvemonkeys：com/twelvemonkeys(16字节) → ysm/twelvemonkeys(16字节)，ISO-8859-1 往返无损
tasks.register('relocateWebp') {
    def outJar = file('repack/webp-relocated.jar')
    outputs.file(outJar)
    doLast {
        outJar.parentFile.mkdirs()
        def seen = new HashSet<String>()
        def jos = new java.util.jar.JarOutputStream(new java.io.FileOutputStream(outJar))
        configurations.webpBundle.each { dep ->
            def jf = new java.util.jar.JarFile(dep)
            jf.entries().each { e ->
                // 条目路径同样重命名（class 与资源文件的引用都已改为 ysm/ 前缀）
                def name = e.name.replace('com/twelvemonkeys', 'ysm/twelvemonkeys')
                if (name == 'module-info.class') return
                if (name.startsWith('META-INF/') && !name.startsWith('META-INF/services/')) return
                if (!seen.add(name)) return
                def bytes = jf.getInputStream(e).bytes
                def s = new String(bytes, 'ISO-8859-1')
                if (s.contains('com/twelvemonkeys') || s.contains('com.twelvemonkeys')) {
                    s = s.replace('com/twelvemonkeys', 'ysm/twelvemonkeys')
                            .replace('com.twelvemonkeys', 'ysm.twelvemonkeys')
                    bytes = s.getBytes('ISO-8859-1')
                }
                jos.putNextEntry(new java.util.jar.JarEntry(name))
                jos.write(bytes)
                jos.closeEntry()
            }
            jf.close()
        }
        jos.close()
        println "relocateWebp -> ${outJar} (${outJar.length()} bytes)"
    }
}

// jar 任务：合并重定位后的 WebP 解码器进主 jar
tasks.named('jar', Jar).configure {
    dependsOn 'relocateWebp'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ zipTree(file('repack/webp-relocated.jar')) })
}
// 如果没有使用Mixin，可以注释掉以下部分
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

// 处理资源文件
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// JAR 文件配置
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
